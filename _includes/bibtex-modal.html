<div class="modal-backdrop" id="bibtex-modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 class="modal-title">BibTeX Citation</h3>
      <button class="modal-close" id="modal-close-btn" aria-label="Close modal">&times;</button>
    </div>
    <pre class="bibtex-code" id="bibtex-code-content"></pre>
    <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
      <button class="btn btn-primary btn-sm" id="copy-bibtex-btn">Copy to Clipboard</button>
    </div>
  </div>
</div>
